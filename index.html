<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 동기화 엘리베이터 시뮬레이터</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="floor-selector-box">
        <label for="floor-picker">SET MY FLOOR</label>
        <select id="floor-picker">
            <option value="1">1F</option>
            <option value="2">2F</option>
            <option value="3">3F</option>
            <option value="4" selected>4F</option>
            <option value="5">5F</option>
            <option value="6">6F</option>
            <option value="7">7F</option>
            <option value="8">8F</option>
        </select>
    </div>

    <div class="elevator-panel">
        <div class="screw top"></div>
        
        <div class="black-screen">
            <div class="led-arrow" id="display-arrow">─</div>
            <div class="led-number" id="display-number">01</div>
            
            <div class="led-timer" id="display-timer">0.00초 뒤 뒤 도착</div>
            
            <div class="led-stop-floor" id="display-stop-floor"></div>
        </div>

        <div class="button-set">
            <button id="btn-up" class="elevator-physical-btn" aria-label="Up">
                <div class="btn-inner">
                    <svg viewBox="0 0 100 100"><polygon points="50,25 85,75 15,75"/></svg>
                </div>
            </button>
            <button id="btn-down" class="elevator-physical-btn" aria-label="Down">
                <div class="btn-inner">
                    <svg viewBox="0 0 100 100"><polygon points="15,25 85,25 50,75"/></svg>
                </div>
            </button>
        </div>

        <div class="screw bottom"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
