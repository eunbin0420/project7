<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리얼 엘리베이터 시뮬레이터</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="elevator-simulator-container">
        
        <div class="elevator-shaft-view">
            <div class="shaft-header">ELEVATOR REALTIME MONITOR</div>
            
            <div class="shaft-inside">
                <div class="shaft-floor-line" data-line="8"><span>8F</span></div>
                <div class="shaft-floor-line" data-line="7"><span>7F</span></div>
                <div class="shaft-floor-line" data-line="6"><span>6F</span></div>
                <div class="shaft-floor-line" data-line="5"><span>5F</span></div>
                <div class="shaft-floor-line" data-line="4"><span>4F</span></div>
                <div class="shaft-floor-line" data-line="3"><span>3F</span></div>
                <div class="shaft-floor-line" data-line="2"><span>2F</span></div>
                <div class="shaft-floor-line" data-line="1"><span>1F</span></div>

                <div id="elevator-car" class="elevator-car">
                    <div class="car-door-left"></div>
                    <div class="car-display">01</div>
                    <div class="car-door-right"></div>
                </div>
            </div>

            <div class="status-ticker">
                <div class="ticker-box">
                    <span class="ticker-label">남은 시간</span>
                    <span id="live-timer-msg" class="ticker-value">00.00초</span>
                </div>
                <div class="ticker-box">
                    <span class="ticker-label">이동 방향</span>
                    <span id="live-status-msg" class="ticker-value">대기중</span>
                </div>
            </div>
        </div>

        <div class="elevator-inside-panel">
            <div class="panel-screw top-left-screw"></div>
            <div class="panel-screw top-right-screw"></div>
            
            <div class="panel-led-indicator">
                <div id="panel-arrow" class="panel-arrow">─</div>
                <div id="panel-floor" class="panel-floor">1</div>
            </div>

            <div class="button-matrix-grid">
                <button class="elevator-inside-btn" data-floor="8">8</button>
                <button class="elevator-inside-btn" data-floor="7">7</button>
                <button class="elevator-inside-btn" data-floor="6">6</button>
                <button class="elevator-inside-btn" data-floor="5">5</button>
                <button class="elevator-inside-btn" data-floor="4">4</button>
                <button class="elevator-inside-btn" data-floor="3">3</button>
                <button class="elevator-inside-btn" data-floor="2">2</button>
                <button class="elevator-inside-btn" data-floor="1">1</button>
            </div>

            <div class="panel-util-row">
                <button class="util-btn" id="btn-door-open">◀||▶</button>
                <button class="util-btn active-util" id="btn-door-close">▶||◀</button>
            </div>
            
            <button id="system-start-trigger">엘리베이터 가동</button>

            <div class="panel-screw bottom-left-screw"></div>
            <div class="panel-screw bottom-right-screw"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
