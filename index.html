<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>엘리베이터 도착 예정시간 프로토타입</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">

  <!-- 왼쪽 영역 -->
  <section class="control-card">

    <div class="title-area">
      <span class="badge">PROTOTYPE</span>
      <h1>예상 정차층 입력</h1>
      <p>
        정차 예정층과 문닫힘 버튼 여부를 반영하여
        도착 시간을 계산합니다.
      </p>
    </div>

    <div class="input-grid">

      <label>
        현재 엘리베이터 층
        <select id="currentFloor"></select>
      </label>

      <label>
        내가 있는 층
        <select id="myFloor"></select>
      </label>

    </div>

    <div class="stop-box">

      <div class="section-title">
        정차 예정층 선택
      </div>

      <div id="stopFloors" class="floor-buttons"></div>

    </div>

    <label class="close-row">
      <input type="checkbox" id="doorClose">
      <span>문닫힘 버튼을 바로 누름</span>
    </label>

    <div class="result-box">

      <div>
        <span>예상 정차층</span>
        <strong id="stopResult">없음</strong>
      </div>

      <div>
        <span>예상 도착시간</span>
        <strong id="timeResult">대기 중</strong>
      </div>

    </div>

    <button class="reset-btn" id="resetBtn">
      초기화
    </button>

  </section>

  <!-- 오른쪽 영역 -->
  <section class="preview-card">

    <div class="elevator-panel">

      <div class="screw top"></div>

      <div class="screen">

        <div id="directionIcon" class="direction">
          ▲
        </div>

        <div id="floorDisplay" class="floor-display">
          1
        </div>

        <div id="etaDisplay" class="eta-display">
          대기 중
        </div>

      </div>

      <button class="call-btn" id="upBtn">
        ▲
      </button>

      <button class="call-btn" id="downBtn">
        ▼
      </button>

      <div class="screw bottom"></div>

    </div>

    <p class="caption">
      버튼을 누르면 오른쪽 화면의 숫자가 실제
      엘리베이터처럼 이동합니다.
    </p>

  </section>

</main>

<script src="script.js"></script>

</body>
</html>
