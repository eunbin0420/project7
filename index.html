<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예상 정차층 입력 시뮬레이터</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <div class="left-panel">
            <div class="input-card">
                <span class="badge-prototype">PROTOTYPE</span>
                <h1 class="title">예상 정차층 입력</h1>
                <p class="description">정차 예정층과 문닫힘 버튼 여부를 반영해 도착 시간을 계산합니다.</p>

                <div class="select-row">
                    <div class="select-box">
                        <label>현재 엘리베이터 층</label>
                        <select id="current-floor-select">
                            <option value="1" selected>1층</option>
                            <option value="2">2층</option>
                            <option value="3">3층</option>
                            <option value="4">4층</option>
                            <option value="5">5층</option>
                            <option value="6">6층</option>
                            <option value="7">7층</option>
                            <option value="8">8층</option>
                        </select>
                    </div>
                    <div class="select-box">
                        <label>내가 있는 층</label>
                        <select id="my-floor-select">
                            <option value="1">1층</option>
                            <option value="2">2층</option>
                            <option value="3">3층</option>
                            <option value="4" selected>4층</option>
                            <option value="5">5층</option>
                            <option value="6">6층</option>
                            <option value="7">7층</option>
                            <option value="8">8층</option>
                        </select>
                    </div>
                </div>

                <div class="floor-grid-zone">
                    <h3 class="grid-title">정차 예정층 선택</h3>
                    <div class="floor-grid">
                        <button class="floor-btn" data-floor="1">1층</button>
                        <button class="floor-btn" data-floor="2">2층</button>
                        <button class="floor-btn" data-floor="3">3층</button>
                        <button class="floor-btn" data-floor="4">4층</button>
                        <button class="floor-btn" data-floor="5">5층</option>
                        <button class="floor-btn" data-floor="6">6층</button>
                        <button class="floor-btn" data-floor="7">7층</option>
                        <button class="floor-btn" data-floor="8">8층</option>
                    </div>
                </div>

                <label class="checkbox-bar">
                    <input type="checkbox" id="door-close-checkbox">
                    <span class="custom-checkbox"></span>
                    <span class="checkbox-text">문닫힘 버튼을 바로 누름</span>
                </label>
                
                <div class="action-buttons">
                    <button id="start-btn">엘리베이터 가동</button>
                    <button id="reset-btn">초기화</button>
                </div>
            </div>

            <div class="result-row">
                <div class="result-card">
                    <div class="result-label">예상 도착시간</div>
                    <div class="result-value text-red" id="widget-time">00.00초</div>
                </div>
                <div class="result-card">
                    <div class="result-label">정차 예정층</div>
                    <div class="result-value text-red" id="widget-next-floor">없음</div>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="elevator-indicator">
                <div class="screw top-screw"></div>
                
                <div class="led-display">
                    <div class="led-arrow" id="screen-arrow">─</div>
                    <div class="led-floor" id="screen-floor">01</div>
                    <div class="led-status-text" id="screen-timer-msg">00.00초 뒤 도착</div>
                    <div class="led-sub-text" id="screen-next-msg">정차 예정층: 없음</div>
                </div>

                <div class="hw-button-area">
                    <button id="hw-btn-up" class="hw-btn">
                        <span class="arrow-up">▲</span>
                    </button>
                    <button id="hw-btn-down" class="hw-btn">
                        <span class="arrow-down">▼</span>
                    </button>
                </div>

                <div class="screw bottom-screw"></div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
