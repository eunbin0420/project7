<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예상 정차층 입력 - 프로토타입</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-wrapper">
        
        <div class="input-card">
            <div class="badge">PROTOTYPE</div>
            <h2>예상 정차층 입력</h2>
            <p class="description">정차 예정층과 문닫힘 버튼 여부를 반영해 도착 시간을 계산합니다.</p>

            <div class="select-row">
                <div class="select-group">
                    <label>현재 엘리베이터 층</label>
                    <select id="current-floor-select">
                        <option value="1" selected>1층</option>
                        <option value="2">2층</option>
                        <option value="3">3층</option>
                        <option value="4">4층</option>
                        <option value="5">5층</option>
                        <option value="6">6층</option>
                        <option value="7">7층</option>
                        <option value="8">8층</option>
                    </select>
                </div>
                <div class="select-group">
                    <label>내가 있는 층</label>
                    <select id="my-floor-select">
                        <option value="1">1층</option>
                        <option value="2">2층</option>
                        <option value="3">3층</option>
                        <option value="4" selected>4층</option>
                        <option value="5">5층</option>
                        <option value="6">6층</option>
                        <option value="7">7층</option>
                        <option value="8">8층</option>
                    </select>
                </div>
            </div>

            <div class="stop-floor-section">
                <h3>정차 예정층 선택</h3>
                <div class="floor-buttons-grid">
                    <button class="floor-btn" data-floor="1">1층</button>
                    <button class="floor-btn" data-floor="2">2층</button>
                    <button class="floor-btn" data-floor="3">3층</button>
                    <button class="floor-btn" data-floor="4">4층</button>
                    <button class="floor-btn" data-floor="5">5층</button>
                    <button class="floor-btn" data-floor="6">6층</button>
                    <button class="floor-btn" data-floor="7">7층</button>
                    <button class="floor-btn" data-floor="8">8층</button>
                </div>
            </div>

            <div class="checkbox-container">
                <input type="checkbox" id="door-close-chebox">
                <label for="door-close-chebox">문닫힘 버튼을 바로 누름</label>
            </div>

            <div class="summary-row">
                <div class="summary-box">
                    <span class="summary-label">예상 도착시간</span>
                    <span id="summary-time" class="summary-value value-red">0.00초</span>
                </div>
                <div class="summary-box">
                    <span class="summary-label">정차 예정층</span>
                    <span id="summary-floor" class="summary-value">없음</span>
                </div>
            </div>
            
            <button id="btn-simulate">엘리베이터 가동</button>
        </div>

        <div class="elevator-panel">
            <div class="screw top-screw"></div>
            
            <div class="led-display-screen">
                <div id="display-arrow" class="arrow-indicator">─</div>
                <div id="display-floor-num" class="floor-number">01</div>
                
                <div class="live-status-group">
                    <div id="led-timer-text">0.00초 뒤 도착</div>
                    <div id="led-next-floor-text">정차 예정층: 없음</div>
                </div>
            </div>

            <div class="hardware-buttons">
                <button class="arrow-btn" id="hw-btn-up">▲</button>
                <button class="arrow-btn" id="hw-btn-down">▼</button>
            </div>

            <div class="screw bottom-screw"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
