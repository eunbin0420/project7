<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>엘리베이터 도착 예정 시간</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="left-panel">
    <h2>목표 층 선택</h2>
    <div id="floorButtons" class="button-grid"></div>

    <h2>정차 예정층 선택</h2>
    <div id="stopButtons" class="button-grid"></div>

    <label class="door-close-box">
      <input type="checkbox" id="doorClose">
      문닫힘 버튼 바로 누름
    </label>

    <div class="info-box">
      <p>예상 도착시간</p>
      <strong id="timeText">대기 중</strong>
    </div>

    <div class="info-box">
      <p>정차 예정층</p>
      <strong id="stopText">없음</strong>
    </div>
  </div>

  <div class="elevator-panel">
    <div class="screw top"></div>

    <div class="screen">
      <div id="direction">─</div>
      <div id="floor">01</div>
      <div id="arrival">대기 중</div>
      <div id="stopInfo">정차 예정층: 없음</div>
    </div>

    <button id="upBtn" class="call-btn">▲</button>
    <button id="downBtn" class="call-btn">▼</button>

    <div class="screw bottom"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
