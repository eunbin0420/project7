<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>엘리베이터 도착 예정 시간</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">

  <!-- 왼쪽 입력 화면 -->
  <section class="control-section">

    <div class="select-row">
      <label>
        현재 엘리베이터 층
        <select id="currentFloor">
          <option value="1">1층</option>
          <option value="2">2층</option>
          <option value="3">3층</option>
          <option value="4" selected>4층</option>
          <option value="5">5층</option>
          <option value="6">6층</option>
          <option value="7">7층</option>
          <option value="8">8층</option>
        </select>
      </label>

      <label>
        내가 있는 층
        <select id="targetFloor">
          <option value="1">1층</option>
          <option value="2">2층</option>
          <option value="3">3층</option>
          <option value="4">4층</option>
          <option value="5">5층</option>
          <option value="6">6층</option>
          <option value="7">7층</option>
          <option value="8" selected>8층</option>
        </select>
      </label>
    </div>

    <div class="stop-card">
      <h3>정차 예정층 다중 선택</h3>
      <div id="stopButtons" class="floor-grid"></div>

      <div class="action-row">
        <button id="callBtn" class="call-main">엘리베이터 호출</button>
        <button id="resetBtn" class="reset-btn">선택 초기화</button>
      </div>
    </div>

  </section>

  <!-- 오른쪽 엘리베이터 화면 -->
  <section class="elevator-section">

    <div class="elevator-panel">

      <div class="screw top"></div>

      <div class="screen">
        <div id="direction" class="direction">↑</div>
        <div id="floorDisplay" class="floor-display">04</div>

        <div id="arrivalTime" class="arrival-time">
          17.57초 뒤<br>도착
        </div>

        <div id="stopInfo" class="stop-info">
          예정 정차층: 없음
        </div>
      </div>

      <button id="upBtn" class="elevator-btn">▲</button>
      <button id="downBtn" class="elevator-btn">▼</button>

      <div class="screw bottom"></div>

    </div>

  </section>

</div>

<script src="script.js"></script>
</body>
</html>
