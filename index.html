<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프리미엄 멀티 엘리베이터 시뮬레이터</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        
        <div class="left-station dark-theme">
            <div class="main-card">
                <span class="badge">ELEVATOR CONTROL</span>
                <h1 class="main-title">예상 정차층 입력</h1>
                <p class="main-desc">정차 예정층과 문닫힘 버튼 활용 여부를 반영하여 실제 하드웨어 구동 시간을 실시간으로 모니터링합니다.</p>

                <div class="dropdown-group">
                    <div class="select-box">
                        <label>현재 엘리베이터 층</label>
                        <select id="current-floor-select">
                            <option value="1" selected>1층</option>
                            <option value="2">2층</option>
                            <option value="3">3층</option>
                            <option value="4">4층</option>
                            <option value="5">5층</option>
                            <option value="6">6층</option>
                            <option value="7">7층</option>
                            <option value="8">8층</option>
                        </select>
                    </div>
                    <div class="select-box">
                        <label>내가 있는 층</label>
                        <select id="my-floor-select">
                            <option value="1">1층</option>
                            <option value="2">2층</option>
                            <option value="3">3층</option>
                            <option value="4" selected>4층</option>
                            <option value="5">5층</option>
                            <option value="6">6층</option>
                            <option value="7">7층</option>
                            <option value="8">8층</option>
                        </select>
                    </div>
                </div>

                <div class="floor-selection-zone">
                    <h3>정차 예정층 선택 (다중 클릭 가능)</h3>
                    <div class="floor-btn-grid">
                        <button class="floor-chip" data-floor="1">1층</button>
                        <button class="floor-chip" data-floor="2">2층</button>
                        <button class="floor-chip" data-floor="3">3층</button>
                        <button class="floor-chip" data-floor="4">4층</button>
                        <button class="floor-chip" data-floor="5">5층</button>
                        <button class="floor-chip" data-floor="6">6층</button>
                        <button class="floor-chip" data-floor="7">7층</button>
                        <button class="floor-chip" data-floor="8">8층</button>
                    </div>
                </div>

                <label class="custom-checkbox-container">
                    <input type="checkbox" id="door-close-checkbox" checked>
                    <span class="checkmark"></span>
                    <span class="checkbox-label">문닫힘 버튼을 바로 누름 (시간 단축)</span>
                </label>

                <div class="action-btn-row">
                    <button id="cta-start-btn">엘리베이터 호출 및 구동</button>
                    <button id="cta-reset-btn">선택 초기화</button>
                </div>
            </div>

            <div class="info-widget-row">
                <div class="widget-card highlight-orange">
                    <div class="widget-label">예상 도착시간</div>
                    <div class="widget-value" id="widget-time">00.00초</div>
                </div>
                <div class="widget-card">
                    <div class="widget-label">정차 예정층</div>
                    <div class="widget-value" id="widget-next-floor">없음</div>
                </div>
                <div class="widget-card text-center">
                    <div class="widget-label">문닫힘 버튼 작동</div>
                    <div class="widget-value" id="widget-door-status">YES</div>
                </div>
            </div>
        </div>

        <div class="right-panel-station">
            <div class="metallic-panel">
                <div class="screw top-screw"></div>
                
                <div class="cyber-led-screen">
                    <div class="led-arrow" id="screen-arrow">─</div>
                    <div class="led-floor" id="screen-floor">01</div>
                    
                    <div class="led-info-text-area">
                        <div class="led-row-dynamic" id="screen-timer-msg">00.00초 뒤 도착</div>
                        <div class="led-row-static" id="screen-next-msg">정차 예정층: 없음</div>
                    </div>
                </div>

                <div class="button-container-box">
                    <button id="hw-btn-up" class="hardware-trigger" disabled>
                        <div class="hw-reflection">
                            <svg viewBox="0 0 100 100"><polygon points="50,18 88,78 12,78"/></svg>
                        </div>
                    </button>
                    <button id="hw-btn-down" class="hardware-trigger" disabled>
                        <div class="hw-reflection">
                            <svg viewBox="0 0 100 100"><polygon points="12,22 88,22 50,82"/></svg>
                        </div>
                    </button>
                </div>

                <div class="screw bottom-screw"></div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
